[package]
name = "pharos-core"
version = "0.1.0"
description = "Core backend library for the Pharos PostgreSQL client"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "json", "ipnetwork", "mac_address", "rust_decimal"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Network types
ipnetwork = "0.20"
mac_address = "1.1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
csv = "1.3"
rust_xlsxwriter = "0.82"
keyring = { version = "3", features = ["apple-native"] }
urlencoding = "2"
sqlformat = "0.3"
flate2 = "1"
# DuckDB 2.0.0, linked against the static libraries scripts/build-duckdb.sh
# builds (with the extensions in duckdb/extension_config.cmake); build.rs adds
# the extension libraries. No `bundled`: that build cannot link out-of-tree
# extensions. `.cargo/config.toml` points libduckdb-sys at the libraries. No
# default features: they add `download-lib`, a build-script download of a
# shared libduckdb that Pharos never uses.
duckdb = { version = "=1.20000.0", default-features = false }

[build-dependencies]
cbindgen = "0.27"

# duckdb with one addition, `Statement::query_streaming` (vendor/duckdb, marked
# "PHAROS PATCH"): rows that stream, with a failed fetch as an Err (1.20000.0's
# only streaming API, `stream_arrow`, panics on one). Drop when a published
# duckdb-rs carries it.
[patch.crates-io]
duckdb = { path = "vendor/duckdb" }

# Build scripts and proc-macros (host tools, never shipped) are not stripped.
# Xcode 27's `strip -S` writes a "mis-aligned LINKEDIT string pool" into a
# newly built proc-macro dylib, and rustc then cannot load it ("can't find
# crate for `sqlx_macros`" / `zerocopy_derive`). sqlx-macros breaks at any
# deployment target; zerocopy-derive breaks with MACOSX_DEPLOYMENT_TARGET=26.0,
# which Xcode's pre-build exports. The staticlib is not affected.
[profile.release.build-override]
strip = false
