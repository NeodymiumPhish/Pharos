name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "pharos-core -> pharos-core/target"

      # llvm-tools: scripts/build-duckdb.sh runs rust-objcopy, which needs
      # the component's libLLVM.dylib since Rust 1.9x.
      - name: Add Intel Rust target and llvm-tools
        run: rustup target add x86_64-apple-darwin && rustup component add llvm-tools

      # DuckDB and its extensions, built from source by scripts/build-duckdb.sh
      # (pinned versions; the key changes when the script or the extension
      # list does). The vcpkg cache holds excel's expat and minizip-ng.
      - name: Cache DuckDB build
        uses: actions/cache@v5
        with:
          path: |
            pharos-core/target/duckdb
            ${{ runner.temp }}/duckdb-build/vcpkg-cache
          key: duckdb-${{ runner.os }}-${{ hashFiles('scripts/build-duckdb.sh', 'pharos-core/duckdb/**') }}

      - name: Install DuckDB build tools
        run: brew install ninja

      - name: Build DuckDB (arm64, x86_64)
        env:
          PHAROS_DUCKDB_WORK: ${{ runner.temp }}/duckdb-build
        run: |
          scripts/build-duckdb.sh arm64
          scripts/build-duckdb.sh x86_64

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Pharos/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Pharos/App/Info.plist
          # Cargo needs SemVer, which forbids leading zeros: a v2.7.001 tag
          # stamps 2.7.001 in the app and 2.7.1 in pharos-core (whose version
          # is the default PostgreSQL application_name).
          CARGO_VERSION="$(echo "$VERSION" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 }')"
          sed -i '' "s/^version = \".*\"/version = \"$CARGO_VERSION\"/" pharos-core/Cargo.toml

      - name: Build Rust library (universal)
        # Each target links its own DuckDB build (pharos-core/build.rs;
        # DUCKDB_LIB_DIR is for libduckdb-sys, .cargo/config.toml defaults it
        # to arm64).
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: |
          cd pharos-core
          DUCKDB_LIB_DIR="$PWD/target/duckdb/aarch64-apple-darwin/lib" \
            cargo build --release --target aarch64-apple-darwin
          DUCKDB_LIB_DIR="$PWD/target/duckdb/x86_64-apple-darwin/lib" \
            cargo build --release --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/libpharos_core.a \
            target/x86_64-apple-darwin/release/libpharos_core.a \
            -output target/release/libpharos_core.a

      - name: Build Xcode project (universal)
        env:
          PHAROS_CI: "1"
        run: |
          xcodebuild build \
            -project Pharos.xcodeproj \
            -scheme Pharos \
            -configuration Release \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            -derivedDataPath ./build

      - name: Verify universal binary
        run: |
          BIN="./build/Build/Products/Release/Pharos.app/Contents/MacOS/Pharos"
          ARCHS=$(lipo -archs "$BIN")
          echo "Built archs: $ARCHS"
          echo "$ARCHS" | grep -q arm64 || { echo "Missing arm64"; exit 1; }
          echo "$ARCHS" | grep -q x86_64 || { echo "Missing x86_64"; exit 1; }

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Pharos" \
            -srcfolder ./build/Build/Products/Release/Pharos.app \
            -ov -format UDZO \
            "Pharos-${GITHUB_REF_NAME}.dmg"

      # The shipped binary is stripped; its dSYM turns crash-log addresses
      # back into function names (atos -o Pharos.app.dSYM/... -l <load addr>).
      # It is for the developer, so it stays OFF the release page: it is kept
      # as this run's "dsym" artifact instead. GitHub keeps an artifact of a
      # public repository for 90 days at most — download it from the run
      # before then to symbolicate this version's crashes later.
      - name: Zip dSYM
        run: |
          ditto -c -k --keepParent \
            ./build/Build/Products/Release/Pharos.app.dSYM \
            "Pharos-${GITHUB_REF_NAME}.dSYM.zip"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: "*.dmg"

      - name: Upload dSYM artifact
        uses: actions/upload-artifact@v7
        with:
          name: dsym
          path: "*.dSYM.zip"
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v8
        with:
          name: dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.dmg"
          generate_release_notes: true

      - name: Trigger Homebrew tap update
        env:
          HOMEBREW_PAT: ${{ secrets.HOMEBREW_PAT }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -X POST \
            -H "Authorization: token $HOMEBREW_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/NeodymiumPhish/homebrew-Pharos/dispatches \
            -d "{\"event_type\": \"release-published\", \"client_payload\": {\"version\": \"$VERSION\"}}"
