name: Pharos
options:
  bundleIdPrefix: com.pharos
  deploymentTarget:
    macOS: "26.0"
  # LastUpgradeCheck: Xcode 27 stops offering "Update to recommended
  # settings" once the settings below are in place.
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Xcode 27's recommended settings.
    DEAD_CODE_STRIPPING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Recommended YES, but a sandboxed script may touch only the files it
    # declares, and the "Build Rust Library" phase runs cargo, which reads
    # the whole crate and ~/.cargo and writes pharos-core/target. With YES
    # the build fails: "failed to read pharos-core/Cargo.toml".
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Pharos:
    type: application
    platform: macOS
    sources:
      - path: Pharos
        excludes:
          - "CPharosCore/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pharos.client
        PRODUCT_NAME: Pharos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Pharos/App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: ""
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Pharos/CPharosCore"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/pharos-core/target/release"
        OTHER_LDFLAGS:
          - "-lpharos_core"
          - "-framework"
          - "Security"
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "CoreFoundation"
          - "-lz"
          - "-liconv"
          - "-lm"
          - "-lresolv"
          # DuckDB and its extensions (scripts/build-duckdb.sh, linked into
          # libpharos_core.a) are C++; minizip-ng (the excel extension) uses
          # -lz and Apple's compression library.
          - "-lc++"
          - "-lcompression"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_IDENTITY: "-"
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        # Strip local symbols from the shipped binary (about 16 MB of
        # DuckDB's); the dSYM keeps them for crash reports (CrashLogger
        # logs raw addresses, symbolicated against the release's dSYM).
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: non-global
    preBuildScripts:
      - name: "Build Rust Library"
        script: |
          if [ -n "$PHAROS_CI" ]; then
            echo "Skipping Rust build — CI pre-built library"
            exit 0
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          # DuckDB with Pharos's extensions, for this Mac's architecture.
          # Skipped when up to date; the first build takes several minutes.
          "${SRCROOT}/scripts/build-duckdb.sh"
          cd "${SRCROOT}/pharos-core"
          cargo build --release
        basedOnDependencyAnalysis: false
